---
# SPDX-FileCopyrightText: Björn Busse <bj.rn@baerlin.eu>
# SPDX-License-Identifier: BSD-3-Clause

name: Build Stage3

on:
  workflow_dispatch:
    inputs:
      stage1_url:
        description: >-
          URL of a Gentoo stage1 tarball to seed the build.
          When omitted, Containerfile.catalyst downloads the current
          official stage3 for this arch from Gentoo mirrors.
          Only usable for a single-arch build.
        required: false
        default: ''
      profile:
        description: >-
          Portage profile for the stage3. Empty derives
          default/linux/<subarch>/23.0, which on amd64 is multilib; append
          /no-multilib to drop the 32-bit toolchain and libraries.
        required: false
        default: ''
      slim:
        description: >-
          Set to 1 to build @system with */* -doc -nls, dropping package
          documentation and gettext translations from the stage3.
        required: false
        default: '0'

jobs:
  build-stage3:
    name: Build stage3 (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 350
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Free up disk for the @system build
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/share/boost || true
          df -h /

      - name: Log in to ghcr
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "$TOKEN" \
            | sudo podman login ghcr.io -u '${{ github.actor }}' --password-stdin

      - name: Fetch seed tarball
        if: inputs.stage1_url != ''
        run: curl -fsSL -o seed.tar.xz '${{ inputs.stage1_url }}'

      - name: Build stage3
        env:
          IMAGE: ghcr.io/bbusse/moonshine-stage3-${{ matrix.arch }}:latest
        run: |
          args=""
          if [ -f seed.tar.xz ]; then
            args="--build-arg STAGE1=seed.tar.xz"
          fi
          sudo podman build \
            --cap-add SYS_ADMIN --cap-add SYS_CHROOT --cap-add MKNOD \
            --build-arg CATALYST_IMAGE=ghcr.io/bbusse/moonshine-catalyst-${{ matrix.arch }}:latest \
            --build-arg SUBARCH=${{ matrix.arch }} \
            --build-arg JOBS="$(nproc)" \
            --build-arg PROFILE='${{ inputs.profile }}' \
            --build-arg SLIM='${{ inputs.slim }}' \
            $args \
            -f Containerfile.stage3 \
            -t "$IMAGE" .

      - name: Push stage3 image
        env:
          IMAGE: ghcr.io/bbusse/moonshine-stage3-${{ matrix.arch }}:latest
        run: sudo podman push "$IMAGE"

  extract-stage3:
    name: Extract stage3 (${{ matrix.arch }})
    needs: build-stage3
    # needs: gates on the whole build matrix, so without this one arch
    # failing would strand the other arch's extract. Each leg stands or
    # falls on whether its own image was pushed
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    permissions:
      contents: write
      packages: read
    uses: bbusse/github-workflows/.github/workflows/container-extract-artifacts.yml@dev
    with:
      image: ghcr.io/bbusse/moonshine-stage3-${{ matrix.arch }}:latest
      use_arm_runner: ${{ matrix.arch == 'arm64' }}
      release: true
      release_tag: latest
      artifacts: |
        [
          {"path": "stage3.tar.xz",
           "name": "stage3-${{ matrix.arch }}.tar.xz",
           "platform": "linux/${{ matrix.arch }}"}
        ]
    secrets:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

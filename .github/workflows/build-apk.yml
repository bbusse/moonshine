name: Build Alpine Package

on:
  push:
    branches:
      - '**'
    tags:
      - 'rc-*'
      - 'release-*'
  pull_request:
    branches:
      - '**'
  workflow_dispatch:

# Both packages upload under a shared `moonshine-` artifact prefix, because the
# release job takes one artifact_name and downloads `<artifact_name>-*` with
# merge-multiple. That collects all four uploads (two packages x two arches)
# into a single release. Splitting them into two release jobs would not work:
# each computes its own version from the VERSION file and commits it back, so
# the second would bump past the first and publish a second, near-empty release.
#
# The released asset names are unaffected -- those come from the apk filenames,
# which abuild takes from each APKBUILD's pkgname
#
# None of these jobs pass `version`, and that is deliberate. Each package here
# is a rebuild of an upstream release -- mesa 26.1.6, sway 1.12, uutils 0.10.0 --
# so pkgver belongs to upstream and lives in the APKBUILD. Passing `version`
# would overwrite it with this repo's own release number, and since the asset
# names carry pkgver, every sha256 pinned in the Containerfiles against
# <pkg>-<pkgver>-r<pkgrel>.<arch>-<release>.apk would stop resolving. A package
# versioned by its own releases, rather than tracking an upstream one, is the
# case that does pass `version`
jobs:
  build-sway-pixman:
    uses: bbusse/github-workflows/.github/workflows/build-apk.yml@dev
    with:
      artifact_name: moonshine-sway-pixman
      build_from_source: true
      working_directory: sway-pixman/apkbuild
      key_name: apk-releases
    secrets: inherit

  build-uutils:
    uses: bbusse/github-workflows/.github/workflows/build-apk.yml@dev
    with:
      artifact_name: moonshine-uutils
      build_from_source: true
      working_directory: uutils/apkbuild
      key_name: apk-releases
    secrets: inherit

  build-mesa-softpipe:
    uses: bbusse/github-workflows/.github/workflows/build-apk.yml@dev
    with:
      artifact_name: moonshine-mesa-softpipe
      build_from_source: true
      working_directory: mesa-softpipe/apkbuild
      key_name: apk-releases
    secrets: inherit

  # The llvmpipe half of the pair. Same source, different gallium driver, and
  # llvm linked in statically -- so it takes appreciably longer to build than
  # the other three
  build-mesa-llvmpipe:
    uses: bbusse/github-workflows/.github/workflows/build-apk.yml@dev
    with:
      artifact_name: moonshine-mesa-llvmpipe
      build_from_source: true
      working_directory: mesa-llvmpipe/apkbuild
      key_name: apk-releases
    secrets: inherit

  release:
    needs:
      - build-sway-pixman
      - build-uutils
      - build-mesa-softpipe
      - build-mesa-llvmpipe
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: bbusse/github-workflows/.github/workflows/release.yml@dev
    with:
      artifact_name: moonshine
      binary_name: moonshine
      release_branch: ci
      version_branch: dev
    secrets: inherit

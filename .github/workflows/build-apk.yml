name: Build Alpine Package

on:
  push:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
    tags:
      - 'rc-*'
      - 'release-*'
  pull_request:
    paths-ignore:
      - '**.md'
    branches:
      - '**'
  workflow_dispatch:

jobs:
  build-apk:
    uses: bbusse/github-workflows/.github/workflows/build-apk.yml@dev
    with:
      artifact_name: sway-pixman
      build_from_source: true
      working_directory: sway-pixman/apkbuild
      key_name: apk-releases
    secrets: inherit

  release:
    needs:
      - build-apk
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    uses: bbusse/github-workflows/.github/workflows/release.yml@dev
    with:
      artifact_name: sway-pixman
      binary_name: sway-pixman
      release_branch: ci
      version_branch: dev
    secrets: inherit
